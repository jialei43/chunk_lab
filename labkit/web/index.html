<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chunk-lab 控制台</title>
<style>
/* ========== 设计令牌：浅色为基准，深色只重定义令牌 ========== */
:root {
  --ground: #F1F4F7;        /* 页面底色 */
  --surface: #FFFFFF;       /* 卡片面 */
  --sunk: #E7ECF1;          /* 凹陷面，用于代码与表头 */
  --ink: #141D28;           /* 主文字 */
  --ink-soft: #3D4C5C;      /* 次级文字 */
  --muted: #6C7E8F;         /* 弱化文字 */
  --line: #D3DBE3;          /* 分隔线 */
  --line-strong: #B4C0CC;   /* 强分隔线 */
  --accent: #1B48CC;        /* 强调色：仪器蓝 */
  --accent-soft: #E4EAFB;   /* 强调色浅底 */
  --good: #0C6E55;          /* 语义色：改善 */
  --good-soft: #DBEFE8;
  --bad: #A62F1B;           /* 语义色：劣化／高危 */
  --bad-soft: #F7E2DD;
  --warn: #8A5A00;          /* 语义色：中等 */
  --warn-soft: #FBEED6;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E141B; --surface: #172029; --sunk: #101922;
    --ink: #E4EBF2; --ink-soft: #B6C4D2; --muted: #8497A8;
    --line: #29353F; --line-strong: #3B4A57;
    --accent: #7CA0FF; --accent-soft: #1B2740;
    --good: #46C79B; --good-soft: #122A24;
    --bad: #EF7358; --bad-soft: #2E1A16;
    --warn: #D2A040; --warn-soft: #2A2113;
  }
}
:root[data-theme="dark"] {
  --ground: #0E141B; --surface: #172029; --sunk: #101922;
  --ink: #E4EBF2; --ink-soft: #B6C4D2; --muted: #8497A8;
  --line: #29353F; --line-strong: #3B4A57;
  --accent: #7CA0FF; --accent-soft: #1B2740;
  --good: #46C79B; --good-soft: #122A24;
  --bad: #EF7358; --bad-soft: #2E1A16;
  --warn: #D2A040; --warn-soft: #2A2113;
}

/* ========== 基础 ========== */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; }
code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ========== 顶栏 ========== */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 0.85rem clamp(1rem, 3vw, 2rem);
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.brand { font-weight: 600; font-size: 1.02rem; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-weight: 400; font-size: 0.82rem; margin-left: 0.5rem; }
.spacer { flex: 1; }

.btn {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 5px;
  padding: 0.42rem 0.85rem; font-size: 0.86rem; font-weight: 500;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ========== 标签页 ========== */
nav {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 0 clamp(1rem, 3vw, 2rem); display: flex; gap: 0.25rem;
  position: sticky; top: 57px; z-index: 19; overflow-x: auto;
}
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 0.65rem 0.9rem; color: var(--muted); font-size: 0.9rem; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

main { padding: clamp(1rem, 3vw, 1.75rem); max-width: 1400px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; }

/* ========== 通用卡片与网格 ========== */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 1.05rem 1.2rem; margin-bottom: 1rem;
}
.card h3 {
  margin: 0 0 0.85rem; font-size: 0.75rem; font-family: var(--mono);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500;
}
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.9rem; }
.stat { display: flex; flex-direction: column; gap: 0.15rem; }
.stat-label { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.stat-value { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }

/* ========== 表格 ========== */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line); }
thead th {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); font-weight: 500;
  position: sticky; top: 0; background: var(--sunk);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable:hover { background: var(--accent-soft); cursor: pointer; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }

/* ========== 条形图（问题分布） ========== */
.bars { display: flex; flex-direction: column; gap: 0.45rem; }
.bar-row { display: grid; grid-template-columns: 11rem 1fr 3rem; gap: 0.7rem; align-items: center; font-size: 0.84rem; }
.bar-name { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { background: var(--sunk); border-radius: 3px; height: 0.6rem; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
.bar-fill.high { background: var(--bad); }
.bar-fill.mid { background: var(--warn); }
.bar-count { font-family: var(--mono); text-align: right; color: var(--ink-soft); }

/* ========== 徽标 ========== */
.pill {
  display: inline-block; font-family: var(--mono); font-size: 0.68rem;
  letter-spacing: 0.04em; padding: 0.1rem 0.4rem; border-radius: 3px;
  border: 1px solid transparent; white-space: nowrap;
}
.pill.high { color: var(--bad); background: var(--bad-soft); }
.pill.medium { color: var(--warn); background: var(--warn-soft); }
.pill.low { color: var(--muted); border-color: var(--line-strong); }
.pill.kind { color: var(--accent); background: var(--accent-soft); }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }

/* ========== 切片预览：左右分栏 ========== */
.split { display: grid; grid-template-columns: 15rem 1fr; gap: 1rem; align-items: start; }
@media (max-width: 800px) { .split { grid-template-columns: 1fr; } }

.case-list { display: flex; flex-direction: column; gap: 0.2rem; max-height: 78vh; overflow-y: auto; }
.case-item {
  background: none; border: 1px solid transparent; border-radius: 5px;
  padding: 0.5rem 0.6rem; text-align: left; color: var(--ink-soft);
  display: flex; flex-direction: column; gap: 0.15rem; width: 100%;
}
.case-item:hover { background: var(--sunk); }
.case-item.active { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.case-item .n { font-size: 0.85rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-item .m { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }

.chunk-stream { display: flex; flex-direction: column; gap: 0.6rem; max-height: 78vh; overflow-y: auto; padding-right: 0.3rem; }

.chunk {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong); border-radius: 5px;
  padding: 0.75rem 0.95rem; display: flex; flex-direction: column; gap: 0.5rem;
}
.chunk.flagged { border-left-color: var(--bad); }
.chunk.flagged-mid { border-left-color: var(--warn); }

.chunk-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
.chunk-idx { color: var(--accent); font-weight: 600; }
.chunk-crumb { font-size: 0.75rem; color: var(--muted); font-style: normal; border-left: 2px solid var(--line); padding-left: 0.5rem; }
.chunk-body { font-size: 0.88rem; line-height: 1.7; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.chunk-body.is-table { font-family: var(--mono); font-size: 0.78rem; white-space: normal; overflow-x: auto; }
.chunk-body table { font-size: 0.76rem; }
.chunk-body td, .chunk-body th { padding: 0.25rem 0.4rem; border: 1px solid var(--line); }

.chunk-issues { display: flex; flex-direction: column; gap: 0.3rem; border-top: 1px dashed var(--line); padding-top: 0.5rem; }
.issue { font-size: 0.78rem; color: var(--ink-soft); display: flex; gap: 0.45rem; align-items: baseline; flex-wrap: wrap; }
.issue .ev { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); background: var(--sunk); padding: 0.05rem 0.35rem; border-radius: 3px; }

/* ========== 语料导入 ========== */
.src-row { display: grid; grid-template-columns: 1.6rem 1fr 6rem 5rem 5rem; gap: 0.6rem; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.84rem; }
.src-row:last-child { border-bottom: none; }
.src-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-row.done { opacity: 0.5; }

input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
input[type="text"], input[type="number"], select {
  font-family: var(--sans); font-size: 0.85rem; padding: 0.32rem 0.5rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: 4px;
}

/* ========== 提示与状态 ========== */
.empty { color: var(--muted); font-size: 0.88rem; padding: 1.5rem 0; text-align: center; }
.toast {
  position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--ground); padding: 0.6rem 1.1rem;
  border-radius: 5px; font-size: 0.86rem; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.toast.show { opacity: 1; }

.spin { display: inline-block; width: 0.8rem; height: 0.8rem; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .toast { transition: none; } }

.delta-up { color: var(--bad); font-family: var(--mono); }
.delta-down { color: var(--good); font-family: var(--mono); }
.hint { font-size: 0.8rem; color: var(--muted); }
.controls { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>

<!-- ========== 顶栏：全局操作 ========== -->
<header>
  <div class="brand">chunk-lab<span>MinerU 切分实验室</span></div>
  <div class="spacer"></div>
  <div class="controls">
    <label>token 预算 <input type="number" id="tokenNum" value="512" min="64" max="4096" step="64" style="width:5rem"></label>
    <label>子分隔符 <input type="text" id="childDeli" value="" placeholder="留空" style="width:5rem"></label>
  </div>
  <button class="btn" id="btnBaseline">设为基线</button>
  <button class="btn primary" id="btnEval">运行评估</button>
</header>

<!-- ========== 标签页导航 ========== -->
<nav>
  <button class="tab active" data-view="overview">概览</button>
  <button class="tab" data-view="chunks">切片预览</button>
  <button class="tab" data-view="corpus">语料库</button>
  <button class="tab" data-view="sources">添加语料</button>
</nav>

<main>
  <!-- ---------- 概览 ---------- -->
  <div class="view active" id="view-overview">
    <div class="card">
      <h3>本轮结果</h3>
      <div class="stat-row" id="statRow">
        <div class="stat"><div class="stat-label">语料</div><div class="stat-value">—</div></div>
        <div class="stat"><div class="stat-label">切片</div><div class="stat-value">—</div></div>
        <div class="stat"><div class="stat-label">问题</div><div class="stat-value">—</div></div>
      </div>
      <p class="hint" id="evalHint" style="margin:0.9rem 0 0">尚未运行。点右上角「运行评估」开始。</p>
    </div>

    <div class="card" id="cmpCard" style="display:none">
      <h3>与基线对比</h3>
      <div id="cmpBody"></div>
    </div>

    <div class="card" id="distCard" style="display:none">
      <h3>问题分布</h3>
      <div class="bars" id="distBars"></div>
    </div>

    <div class="card" id="caseCard" style="display:none">
      <h3>逐样本（点击行查看切片）</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>样本</th><th>类型</th><th class="num">原始块</th><th class="num">切片</th><th class="num">问题</th></tr></thead>
          <tbody id="caseRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ---------- 切片预览 ---------- -->
  <div class="view" id="view-chunks">
    <div class="split">
      <div class="card" style="margin:0">
        <h3>样本</h3>
        <div class="case-list" id="chunkCaseList"><div class="empty">加载中…</div></div>
      </div>
      <div>
        <div class="card" style="margin-bottom:0.7rem" id="chunkMeta">
          <p class="hint" style="margin:0">从左侧选一个样本，查看它的实际切分结果。有问题的切片会被标注。</p>
        </div>
        <div class="chunk-stream" id="chunkStream"></div>
      </div>
    </div>
  </div>

  <!-- ---------- 语料库 ---------- -->
  <div class="view" id="view-corpus">
    <div class="card">
      <h3>当前语料</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>样本</th><th>文件名</th><th>类型</th><th class="num">原始块</th><th>备注</th></tr></thead>
          <tbody id="corpusRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ---------- 添加语料 ---------- -->
  <div class="view" id="view-sources">
    <div class="card">
      <h3>本机 MinerU 产物</h3>
      <p class="hint" style="margin:0 0 0.9rem">
        同一文档的重复解析副本已自动去重，只保留最新一份；但同一文档的不同 backend 会各保留一条——
        它们喂给切分器的块数可能差两成，是有价值的对照。
      </p>
      <div class="controls" style="margin-bottom:0.8rem">
        <label><input type="checkbox" id="hideImported" checked> 隐藏已导入</label>
        <input type="text" id="srcFilter" placeholder="按文档名筛选…" style="flex:1;min-width:10rem">
        <button class="btn primary" id="btnImport" disabled>导入选中</button>
      </div>
      <div id="srcList"><div class="empty">加载中…</div></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ========== 全局状态 ==========
let lastReport = null;      // 最近一次评估报告
let corpusCache = [];       // 语料列表缓存
let sourcesCache = [];      // 可导入产物缓存
let currentCase = null;     // 切片预览中当前选中的样本

// ========== 工具函数 ==========

// 轻量元素选择器
const $ = (id) => document.getElementById(id);

// 转义 HTML，防止正文中的尖括号破坏页面结构
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 底部浮层提示，用于反馈操作结果
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// 读取顶栏的运行参数，评估与预览共用同一套口径
function runParams() {
  return {
    chunk_token_num: parseInt($("tokenNum").value) || 512,
    children_delimiter: $("childDeli").value || "",
  };
}

// 统一的接口请求封装
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `请求失败 (${res.status})`);
  return data;
}

// 按严重度取徽标样式，未知严重度回落到 low
function sevClass(sev) {
  return ["high", "medium", "low"].includes(sev) ? sev : "low";
}

// ========== 标签页切换 ==========
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    // 切换按钮激活态
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    // 切换视图显示
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    $("view-" + tab.dataset.view).classList.add("active");
    // 进入对应视图时按需加载数据
    if (tab.dataset.view === "corpus") loadCorpus();
    if (tab.dataset.view === "sources") loadSources();
    if (tab.dataset.view === "chunks") loadChunkCaseList();
  });
});

// ========== 运行评估 ==========
$("btnEval").addEventListener("click", async () => {
  const btn = $("btnEval");
  // 置为运行中，避免重复点击造成 CPU 争抢
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 评估中…';
  $("evalHint").textContent = "正在离线重放切分逻辑，全量约需十余秒…";
  try {
    // 请求评估，并要求同时与基线对比
    const data = await api("/api/eval", {
      method: "POST",
      body: JSON.stringify({ ...runParams(), compare: true }),
    });
    lastReport = data.report;
    renderOverview(data.report, data.comparison);
    toast(`评估完成：${data.report.finding_total} 条问题`);
  } catch (e) {
    toast("评估失败：" + e.message);
    $("evalHint").textContent = "评估失败：" + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "运行评估";
  }
});

// ========== 设为基线 ==========
$("btnBaseline").addEventListener("click", async () => {
  // 未跑过评估时无从固化，直接提示
  if (!lastReport) return toast("请先运行一次评估");
  try {
    await api("/api/baseline", { method: "POST" });
    toast("基线已更新为本轮结果");
  } catch (e) {
    toast("保存失败：" + e.message);
  }
});

// ========== 概览渲染 ==========
function renderOverview(report, comparison) {
  // 顶部三个总量指标
  $("statRow").innerHTML = `
    <div class="stat"><div class="stat-label">语料</div><div class="stat-value">${report.case_count}</div></div>
    <div class="stat"><div class="stat-label">切片</div><div class="stat-value">${report.chunk_total}</div></div>
    <div class="stat"><div class="stat-label">问题</div><div class="stat-value">${report.finding_total}</div></div>
  `;
  $("evalHint").textContent = `运行于 ${report.generated_at}　参数 token=${report.config.chunk_token_num}　子分隔符=${JSON.stringify(report.config.children_delimiter)}`;

  // 与基线的对比区
  renderComparison(comparison);

  // 问题分布条形图，按命中数降序
  const totals = Object.entries(report.totals_by_detector).sort((a, b) => b[1] - a[1]);
  if (totals.length) {
    const max = totals[0][1];
    // 高危检测器用红色，其余用强调色
    const highSet = ["truncated_sentence", "broken_table", "garbled_text", "noise_residue", "spaced_characters"];
    $("distBars").innerHTML = totals.map(([name, count]) => {
      const cls = highSet.includes(name) ? "high" : "";
      return `<div class="bar-row">
        <div class="bar-name" title="${esc(name)}">${esc(name)}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${(count / max * 100).toFixed(1)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>`;
    }).join("");
    $("distCard").style.display = "";
  } else {
    $("distCard").style.display = "none";
  }

  // 逐样本表格，点击行跳转到切片预览
  $("caseRows").innerHTML = report.cases.map(c => {
    if (c.error) {
      return `<tr><td>${esc(c.case_id)}</td><td colspan="4" style="color:var(--bad)">切分失败：${esc(c.error)}</td></tr>`;
    }
    return `<tr class="clickable" data-case="${esc(c.case_id)}">
      <td>${esc(c.case_id)}</td>
      <td><span class="pill kind">${esc(c.kind || "?")}</span></td>
      <td class="num">${c.block_count}</td>
      <td class="num">${c.chunk_count}</td>
      <td class="num">${c.finding_count}</td>
    </tr>`;
  }).join("");
  // 绑定行点击，直接跳到该样本的切片预览
  $("caseRows").querySelectorAll("tr.clickable").forEach(tr => {
    tr.addEventListener("click", () => {
      document.querySelector('.tab[data-view="chunks"]').click();
      loadChunkCaseList().then(() => selectCase(tr.dataset.case));
    });
  });
  $("caseCard").style.display = "";
}

// ========== 对比渲染 ==========
function renderComparison(cmp) {
  // 无基线或无对比数据时隐藏该区块
  if (!cmp) {
    $("cmpCard").style.display = "none";
    return;
  }
  const delta = cmp.finding_after - cmp.finding_before;
  // 命中减少是改善，增加是劣化
  const dirClass = delta < 0 ? "delta-down" : (delta > 0 ? "delta-up" : "");
  const dirText = delta < 0 ? "改善" : (delta > 0 ? "劣化" : "持平");

  let html = `<div class="stat-row" style="margin-bottom:1rem">
    <div class="stat"><div class="stat-label">问题总数</div>
      <div class="stat-value">${cmp.finding_before} → ${cmp.finding_after}
        <span class="pill ${delta < 0 ? "good" : (delta > 0 ? "bad" : "low")}" style="font-size:0.7rem;vertical-align:middle">${delta >= 0 ? "+" : ""}${delta} ${dirText}</span>
      </div></div>
  </div>`;

  // 逐检测器的升降
  if (cmp.by_detector.length) {
    html += `<div class="table-wrap"><table>
      <thead><tr><th>检测器</th><th class="num">基线</th><th class="num">当前</th><th class="num">变化</th></tr></thead><tbody>`;
    cmp.by_detector.sort((a, b) => b.delta - a.delta).forEach(d => {
      const c = d.delta > 0 ? "delta-up" : "delta-down";
      html += `<tr><td>${esc(d.detector)}</td><td class="num">${d.before}</td><td class="num">${d.after}</td>
        <td class="num ${c}">${d.delta > 0 ? "+" : ""}${d.delta}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // 逐样本的升降；切片数变化单列，用于捕捉「问题数不变但粒度剧变」的回归
  if (cmp.by_case.length) {
    html += `<h3 style="margin-top:1.2rem">按样本</h3><div class="table-wrap"><table>
      <thead><tr><th>样本</th><th class="num">问题</th><th class="num">变化</th><th class="num">切片</th><th class="num">变化</th></tr></thead><tbody>`;
    cmp.by_case.forEach(c => {
      const fd = c.finding_after - c.finding_before;
      const cd = c.chunk_after - c.chunk_before;
      html += `<tr>
        <td>${esc(c.case_id)}</td>
        <td class="num">${c.finding_before}→${c.finding_after}</td>
        <td class="num ${fd > 0 ? "delta-up" : (fd < 0 ? "delta-down" : "")}">${fd > 0 ? "+" : ""}${fd || "—"}</td>
        <td class="num">${c.chunk_before}→${c.chunk_after}</td>
        <td class="num ${cd !== 0 ? "delta-up" : ""}">${cd > 0 ? "+" : ""}${cd || "—"}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (!cmp.by_detector.length && !cmp.by_case.length) {
    html += `<p class="hint" style="margin:0">与基线完全一致，无任何指标变化。</p>`;
  }

  $("cmpBody").innerHTML = html;
  $("cmpCard").style.display = "";
}

// ========== 语料库 ==========
async function loadCorpus() {
  try {
    corpusCache = await api("/api/corpus");
    if (!corpusCache.length) {
      $("corpusRows").innerHTML = `<tr><td colspan="5" class="empty">语料库为空，去「添加语料」导入产物</td></tr>`;
      return;
    }
    $("corpusRows").innerHTML = corpusCache.map(c => `<tr>
      <td>${esc(c.case_id)}</td>
      <td>${esc(c.filename)}</td>
      <td><span class="pill kind">${esc(c.kind)}</span>${c.slide_mode ? ' <span class="pill low">slide</span>' : ""}</td>
      <td class="num">${c.block_count}</td>
      <td class="hint">${esc(c.note)}</td>
    </tr>`).join("");
  } catch (e) {
    toast("加载语料失败：" + e.message);
  }
}

// ========== 切片预览：样本列表 ==========
async function loadChunkCaseList() {
  try {
    if (!corpusCache.length) corpusCache = await api("/api/corpus");
    if (!corpusCache.length) {
      $("chunkCaseList").innerHTML = `<div class="empty">语料库为空</div>`;
      return;
    }
    $("chunkCaseList").innerHTML = corpusCache.map(c => `
      <button class="case-item" data-case="${esc(c.case_id)}">
        <span class="n">${esc(c.case_id)}</span>
        <span class="m">${esc(c.kind)} · ${c.block_count} 块</span>
      </button>`).join("");
    $("chunkCaseList").querySelectorAll(".case-item").forEach(btn => {
      btn.addEventListener("click", () => selectCase(btn.dataset.case));
    });
  } catch (e) {
    toast("加载失败：" + e.message);
  }
}

// ========== 切片预览：加载并渲染某个样本 ==========
async function selectCase(caseId) {
  currentCase = caseId;
  // 更新左侧选中态
  $("chunkCaseList").querySelectorAll(".case-item").forEach(b => {
    b.classList.toggle("active", b.dataset.case === caseId);
  });
  $("chunkStream").innerHTML = `<div class="empty"><span class="spin"></span> 正在切分…</div>`;
  $("chunkMeta").innerHTML = `<p class="hint" style="margin:0">${esc(caseId)}　切分中…</p>`;

  try {
    const p = runParams();
    const q = new URLSearchParams({
      chunk_token_num: p.chunk_token_num,
      children_delimiter: p.children_delimiter,
    });
    const data = await api(`/api/case/${encodeURIComponent(caseId)}?${q}`);
    if (data.error) {
      $("chunkStream").innerHTML = `<div class="empty" style="color:var(--bad)">切分失败：${esc(data.error)}</div>`;
      return;
    }
    // 顶部元信息
    $("chunkMeta").innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="stat-label">文件</div><div class="stat-value" style="font-size:0.95rem">${esc(data.filename)}</div></div>
        <div class="stat"><div class="stat-label">切片</div><div class="stat-value">${data.chunk_count}</div></div>
        <div class="stat"><div class="stat-label">问题</div><div class="stat-value">${data.finding_count}</div></div>
      </div>`;
    // 逐块渲染
    $("chunkStream").innerHTML = data.chunks.map(renderChunk).join("");
  } catch (e) {
    $("chunkStream").innerHTML = `<div class="empty" style="color:var(--bad)">加载失败：${esc(e.message)}</div>`;
  }
}

// 渲染单个切片卡片：元信息 + 正文 + 问题标注
function renderChunk(c) {
  // 依据最高严重度决定左边框颜色
  const sevs = c.findings.map(f => f.severity);
  const cls = sevs.includes("high") ? "flagged" : (sevs.length ? "flagged-mid" : "");
  // 表格块保留 HTML 结构渲染，正文块转义后按预格式展示
  const isTable = c.doc_type_kwd === "table";
  const body = isTable ? c.content : esc(c.content);
  // 面包屑
  const crumb = (c.important_kwd || []).join(" > ");
  // 问题列表
  const issues = c.findings.map(f => `
    <div class="issue">
      <span class="pill ${sevClass(f.severity)}">${esc(f.detector)}</span>
      <span>${esc(f.message)}</span>
      ${f.evidence ? `<span class="ev">${esc(f.evidence.slice(0, 90))}</span>` : ""}
    </div>`).join("");

  return `<div class="chunk ${cls}">
    <div class="chunk-head">
      <span class="chunk-idx">#${c.index}</span>
      <span>${esc(c.doc_type_kwd || "text")}</span>
      <span>${c.content_len} 字</span>
      ${c.page_num_int.length ? `<span>页 ${c.page_num_int.join(",")}</span>` : ""}
      ${c.is_child ? `<span class="pill low">子块</span>` : ""}
      ${c.has_image ? `<span class="pill low">含图</span>` : ""}
      ${crumb ? `<span class="chunk-crumb">${esc(crumb)}</span>` : ""}
    </div>
    <div class="chunk-body ${isTable ? "is-table" : ""}">${body}</div>
    ${issues ? `<div class="chunk-issues">${issues}</div>` : ""}
  </div>`;
}

// ========== 添加语料：扫描本机产物 ==========
async function loadSources() {
  // 已加载过则不重复扫描，扫描全盘较慢
  if (sourcesCache.length) return renderSources();
  $("srcList").innerHTML = `<div class="empty"><span class="spin"></span> 正在扫描本机产物…</div>`;
  try {
    sourcesCache = await api("/api/sources");
    renderSources();
  } catch (e) {
    $("srcList").innerHTML = `<div class="empty" style="color:var(--bad)">扫描失败：${esc(e.message)}</div>`;
  }
}

// 渲染候选产物列表，支持筛选与隐藏已导入
function renderSources() {
  const hideImported = $("hideImported").checked;
  const filter = $("srcFilter").value.trim().toLowerCase();
  const items = sourcesCache.filter(s =>
    (!hideImported || !s.imported) &&
    (!filter || s.doc_name.toLowerCase().includes(filter)));

  if (!items.length) {
    $("srcList").innerHTML = `<div class="empty">没有符合条件的产物</div>`;
    return;
  }
  $("srcList").innerHTML =
    `<div class="src-row" style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em">
      <span></span><span>文档</span><span>backend</span><span style="text-align:right">块数</span><span>状态</span>
    </div>` +
    items.map(s => {
      const idx = sourcesCache.indexOf(s);
      return `<div class="src-row ${s.imported ? "done" : ""}">
        <input type="checkbox" class="src-cb" data-idx="${idx}" ${s.imported ? "disabled" : ""}>
        <span class="src-name" title="${esc(s.path)}">${esc(s.doc_name)}</span>
        <span class="mono" style="font-size:0.76rem;color:var(--muted)">${esc(s.backend)}</span>
        <span class="mono" style="text-align:right">${s.block_count}</span>
        <span>${s.imported ? '<span class="pill low">已导入</span>' : `<span class="pill kind">${esc(s.kind)}</span>`}</span>
      </div>`;
    }).join("");

  // 勾选变化时更新导入按钮可用状态
  $("srcList").querySelectorAll(".src-cb").forEach(cb => {
    cb.addEventListener("change", () => {
      const n = $("srcList").querySelectorAll(".src-cb:checked").length;
      $("btnImport").disabled = n === 0;
      $("btnImport").textContent = n ? `导入选中 (${n})` : "导入选中";
    });
  });
}

// 筛选控件联动
$("hideImported").addEventListener("change", renderSources);
$("srcFilter").addEventListener("input", renderSources);

// ========== 执行导入 ==========
$("btnImport").addEventListener("click", async () => {
  const checked = [...$("srcList").querySelectorAll(".src-cb:checked")];
  if (!checked.length) return;
  const items = checked.map(cb => {
    const s = sourcesCache[parseInt(cb.dataset.idx)];
    return {
      path: s.path,
      filename: s.filename,
      kind: s.kind,
      // PPTX 默认启用按幻灯片切分，与生产的 presentation 路径保持一致
      slide: s.kind === "pptx",
    };
  });
  const btn = $("btnImport");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 导入中…';
  try {
    const data = await api("/api/corpus/import", {
      method: "POST",
      body: JSON.stringify({ items }),
    });
    const ok = data.results.filter(r => r.ok).length;
    toast(`导入完成：成功 ${ok} / ${data.results.length}`);
    // 导入后刷新各处缓存，使新样本立即可用
    sourcesCache = [];
    corpusCache = [];
    await loadSources();
    btn.textContent = "导入选中";
  } catch (e) {
    toast("导入失败：" + e.message);
    btn.textContent = "导入选中";
    btn.disabled = false;
  }
});

// ========== 启动：拉取基线摘要作为初始上下文 ==========
(async function init() {
  try {
    const b = await api("/api/baseline");
    if (b.exists) {
      $("evalHint").textContent =
        `当前基线：${b.generated_at}　${b.case_count} 个语料 / ${b.chunk_total} 切片 / ${b.finding_total} 问题。点「运行评估」与之对比。`;
    }
  } catch (e) { /* 基线缺失属正常初始状态，静默处理 */ }
})();
</script>
